<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIMAKI CALC</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#777b75;font-family:Arial,sans-serif;color:#262823}.mc{max-width:760px;margin:auto;background:#b9b9b0;border:1px solid #85877f;border-radius:14px;padding:16px;box-shadow:inset 0 1px #eee,0 9px 30px #3336}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.14em}.model,.status{font:11px 'Courier New',monospace;color:#555}.badge{background:#343734;color:white;padding:5px 8px;font:10px monospace}.lcd{margin:14px 0;background:#9eaa83;border:3px inset #727765;border-radius:5px;padding:14px;font-family:'Courier New',monospace;color:#172116}.lcd .price{font-size:clamp(29px,7vw,48px);font-weight:900;text-align:right}.nestlcd{margin-top:0;padding-top:0;border-top:0;background:#9eaa83;border:3px inset #727765;border-radius:5px;padding:12px;color:#172116}.nestpanel{margin-top:11px}.nesthead{display:flex;justify-content:space-between;font:10px monospace;margin-bottom:6px}.nestsvg{width:100%;height:auto;max-height:190px;display:block}.nestfoot{font:10px monospace;margin-top:5px}.lcdsub{border-top:1px solid #55654d;margin-top:9px;padding-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px}.plate{background:#c7c7bf;border:1px solid #85877f;border-radius:7px;padding:12px;margin-top:11px}.title{font-size:11px;font-weight:900;letter-spacing:.12em;color:#50524a;margin-bottom:10px}.inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.field{min-width:0}.field label{display:block;font-size:10px;font-weight:900;margin-bottom:5px}.field input,.field select{width:100%;min-height:42px;background:#efefe9;border:2px inset #a4a49d;border-radius:3px;padding:7px;font:700 15px 'Courier New',monospace}.field small{display:block;color:#555;margin-top:3px}.wide{margin-top:10px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.key,.btn{cursor:pointer;background:#d5d5cd;border:1px solid #777970;border-bottom:4px solid #696b64;border-radius:5px;min-height:44px;font-weight:900}.key{font-size:10px}.key small{display:block;font-size:9px;margin-top:4px}.key.on{background:#6f7771;color:white;border-bottom-width:1px}.extras,.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.calc{font:12px/1.8 'Courier New',monospace;overflow-wrap:anywhere}.service summary{cursor:pointer;font-weight:900;letter-spacing:.1em;font-size:12px}.full{grid-column:1/-1}.box{background:#bdbdb5;border:1px solid #999b93;padding:10px;border-radius:5px}.dbrow{display:grid;grid-template-columns:2fr .9fr .9fr 1fr 34px;gap:5px;margin-top:7px}.dbrow input{min-width:0;width:100%;background:#eee;border:2px inset #aaa;padding:7px;font:12px monospace}.dbrow button{cursor:pointer}.btn{padding:6px 12px;margin:8px 5px 0 0;min-height:35px;font-size:10px}.save{background:#6f7771;color:white}.inkrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:6px;align-items:end;margin-top:7px}.inkrow b{padding-bottom:12px}.status{margin-top:10px}.hint{font:10px 'Courier New',monospace;color:#555;margin-top:5px}@media(max-width:540px){body{padding:8px}.mc{padding:10px}.inputs{grid-template-columns:1fr 1fr}.inputs .field:last-child{grid-column:1/-1}.keys,.extras,.settings{grid-template-columns:1fr 1fr}.dbrow{grid-template-columns:1fr 1fr}.dbrow input:first-child{grid-column:1/-1}.inkrow{grid-template-columns:25px 1fr 1fr}.inkrow span{grid-column:2/-1}}
</style></head><body><main class="mc">
<div class="top"><div><div class="brand">MIMAKI CALC</div><div class="model">CJV150-130 // COST COMPUTER</div></div><span class="badge">READY</span></div>
<div class="lcd"><div style="font-size:11px;letter-spacing:.15em">VK NETTO</div><div id="price" class="price">0,00 EUR</div><div class="lcdsub"><span id="perpiece"></span><span id="lfm"></span></div></div>
<div class="plate"><div class="title">JOB INPUT</div><div class="inputs"><div class="field"><label>BREITE MM</label><input id="w" type="number" min="1" value="500"></div><div class="field"><label>HÖHE MM</label><input id="h" type="number" min="1" value="300"></div><div class="field"><label>MENGE STK</label><input id="qty" type="number" min="1" value="10"></div></div><div class="field wide"><label>MATERIAL</label><select id="material"></select></div></div>
<div class="plate nestpanel"><div class="title">NUTZENPLAN // LIVE PREVIEW</div><div class="nestlcd"><div class="nesthead"><span>NUTZEN / BAHNVORSCHAU</span><span id="nestorientation"></span></div><div id="nestpreview"></div><div class="nestfoot" id="nestdetail"></div></div></div>
<div class="keys"><button class="key" data-key="lam">LAMINAT<small>OFF</small></button><button class="key" data-key="contour">KONTUR<small>OFF</small></button><button class="key" data-key="eye">ÖSEN<small>OFF</small></button><button class="key" data-key="trim">HANDSCHNITT<small>OFF</small></button></div>
<div id="extras" class="extras"></div>
<div class="plate"><div class="title">CALCULATION</div><div id="layout" class="calc"></div><div id="costs" class="calc"></div></div>
<details class="plate service"><summary>SETUP / SERVICE</summary><div class="settings">
<div class="field"><label>BESCHNITT JE NUTZEN MM</label><input id="gap" type="number" min="0" value="3"></div><div class="field"><label>ZWISCHENSCHNITT MM</label><input id="cut" type="number" min="0" value="0"></div><div class="field"><label>SEITENRAND / SEITE MM</label><input id="margin" type="number" min="0" value="10"></div><div class="field"><label>MIMAKI EUR/M²</label><input id="machine" type="number" min="0" step=".01" value="4"></div><div class="field"><label>FAKTOR</label><input id="factor" type="number" min="0" step=".1" value="2"></div><div class="field"><label>MINDESTPREIS EUR</label><input id="minimum" type="number" min="0" step=".01" value="15"></div>
<div class="box full"><div class="title">INK SYSTEM // EASY INKS CMYK</div><div id="inks"></div><div class="field wide"><label>GESAMTVERBRAUCH ML/M²</label><input id="inkuse" type="number" min="0" step=".1" value="8"></div><div id="inkinfo" class="hint"></div></div>
<div class="box full"><div class="title">MATERIAL DATABASE</div><div class="hint">NAME / ROLLENBREITE MM / LÄNGE M / EK EUR</div><div id="matdb"></div><button id="addmat" class="btn">+ MATERIAL</button><button id="savemat" class="btn save">SAVE MATERIALS</button><div id="matmsg" class="hint"></div></div>
<div class="box full"><div class="title">LAMINATE DATABASE</div><div class="hint">NAME / ROLLENBREITE MM / LÄNGE M / EK EUR</div><div id="lamdb"></div><button id="addlam" class="btn">+ LAMINAT</button><button id="savelam" class="btn save">SAVE LAMINATES</button><div id="lammsg" class="hint"></div></div>
<button id="savesettings" class="btn save full">SAVE SETTINGS + INK</button><div id="settingsmsg" class="hint full"></div>
</div></details><div id="status" class="status"></div></main>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],n=id=>Math.max(0,Number($('#'+id)?.value)||0),f=v=>Number(v).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const defaults=[{id:1,name:'ORAJET 3164 XG',width:1370,length:50,price:145},{id:2,name:'ORAJET 3164 X RA',width:1370,length:50,price:175},{id:3,name:'ORACAL 3551',width:1370,length:50,price:220},{id:4,name:'PVC BANNER',width:1370,length:50,price:125}],lamdefaults=[{id:101,name:'STANDARD GLANZ',width:1370,length:50,price:110},{id:102,name:'STANDARD MATT',width:1370,length:50,price:115}];
function read(k,d){try{let x=JSON.parse(localStorage.getItem(k));return x??d}catch{return d}}
let mats=read('mimakiMaterials',defaults),lams=read('mimakiLaminates',lamdefaults),state={lam:false,contour:false,eye:false,trim:false};
const saved=read('mimakiSettings',{});for(let id of ['gap','cut','margin','machine','factor','minimum','inkuse'])if(saved[id]!==undefined)$('#'+id).value=saved[id];
$('#inks').innerHTML=['C','M','Y','K'].map((c,i)=>'<div class="inkrow"><b>'+c+'</b><div class="field"><label>ML</label><input class="inkml" data-i="'+i+'" type="number" value="'+(saved.inks?.[i]?.ml??440)+'"></div><div class="field"><label>EK EUR</label><input class="inkprice" data-i="'+i+'" type="number" step=".01" value="'+(saved.inks?.[i]?.price??30)+'"></div><span id="inkrate'+i+'" class="hint"></span></div>').join('');
function opts(){let mv=$('#material').value,lv=$('#lamselect')?.value;$('#material').innerHTML=mats.map(m=>'<option value="'+m.id+'">'+esc(m.name)+' // '+m.width+' MM</option>').join('');if(mats.some(m=>String(m.id)===mv))$('#material').value=mv;if($('#lamselect')){$('#lamselect').innerHTML=lams.map(m=>'<option value="'+m.id+'">'+esc(m.name)+' // '+m.width+' MM</option>').join('');if(lams.some(m=>String(m.id)===lv))$('#lamselect').value=lv}}
function renderDB(){for(let [type,arr,target] of [['mat',mats,'#matdb'],['lam',lams,'#lamdb']]){$(target).innerHTML=arr.map((m,i)=>'<div class="dbrow" data-type="'+type+'" data-i="'+i+'"><input data-f="name" value="'+esc(m.name)+'"><input data-f="width" type="number" value="'+m.width+'"><input data-f="length" type="number" value="'+m.length+'"><input data-f="price" type="number" step=".01" value="'+m.price+'"><button type="button" class="del">×</button></div>').join('')}$$('.dbrow input').forEach(el=>el.addEventListener('input',()=>{let r=el.closest('.dbrow'),arr=r.dataset.type==='mat'?mats:lams;arr[+r.dataset.i][el.dataset.f]=el.dataset.f==='name'?el.value:Math.max(0,Number(el.value)||0);opts();calc()}));$$('.del').forEach(el=>el.onclick=()=>{let r=el.closest('.dbrow'),arr=r.dataset.type==='mat'?mats:lams;if(arr.length<2)return;arr.splice(+r.dataset.i,1);renderDB();opts();extras()})}
function extras(){let s='';if(state.lam)s+='<div class="field"><label>LAMINAT</label><select id="lamselect"></select><div id="lamnote" class="hint"></div></div><div class="field"><label>LAMINIEREN EUR/M²</label><input id="lamwork" type="number" step=".01" value="1.5"></div>';if(state.contour)s+='<div class="field"><label>KONTUR PAUSCHAL EUR</label><input id="excontour" type="number" value="5"></div>';if(state.eye)s+='<div class="field"><label>ÖSEN STK</label><input id="eyeq" type="number" value="8"></div><div class="field"><label>EUR/ÖSE</label><input id="eyep" type="number" step=".01" value=".5"></div>';if(state.trim)s+='<div class="field"><label>HANDSCHNITT STK</label><input id="trimq" type="number" value="'+n('qty')+'"></div><div class="field"><label>EUR/STK</label><input id="trimp" type="number" step=".01" value=".5"></div>';$('#extras').innerHTML=s;opts();$$('#extras input,#extras select').forEach(el=>el.addEventListener('input',calc));calc()}
function drawNest(p,m,qty,gap,cut){
 const W=640,pad=36,inner=W-2*pad,scale=inner/m.width,show=Math.min(p.rows,4),step=p.pieceH+gap+cut,shownHeight=Math.max(1,show*p.pieceH+(show-1)*(gap+cut)),H=Math.min(205,Math.max(75,shownHeight*scale+38)),sy=(H-28)/shownHeight;
 const rect=(x,y,w,h,fill,stroke='#43533d')=>'<rect x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" width="'+Math.max(0,w).toFixed(2)+'" height="'+Math.max(0,h).toFixed(2)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1"/>';
 let out='<svg class="nestsvg" viewBox="0 0 '+W+' '+(H+25)+'" role="img" aria-label="Schematische Nutzenanordnung auf Druckbahn">';
 out+=rect(pad,12,inner,H-12,'#a9b798','#354332');
 for(let r=0;r<show;r++){let count=Math.min(p.across,qty-r*p.across);for(let j=0;j<count;j++){let rowWidth=count*p.pieceW+Math.max(0,count-1)*gap,x=pad+((m.width-rowWidth)/2+j*(p.pieceW+gap))*scale,y=17+r*step*sy,rw=p.pieceW*scale,rh=p.pieceH*sy;out+=rect(x,y,rw,rh,'#cbd7b8');if(rw>30&&rh>17)out+='<text x="'+(x+rw/2)+'" y="'+(y+rh/2+3)+'" text-anchor="middle" font-size="10" fill="#344332">'+(r*p.across+j+1)+'</text>'}}
 out+='<text x="'+(W/2)+'" y="'+(H+13)+'" text-anchor="middle" font-size="11" fill="#253420">ROLLE '+m.width+' MM ↓ VORSCHUB</text></svg>';
 $('#nestpreview').innerHTML=out;$('#nestorientation').textContent=p.rot?'90° ROTIERT':'0° NORMAL';
 $('#nestdetail').textContent=p.across+' NEBENEINANDER × '+p.rows+' REIHEN · '+f(p.len/1000)+' LFM · '+f(gap)+' MM ABSTAND · '+f(cut)+' MM ZWISCHENSCHNITT'+(p.rows>show?' · VORSCHAU: '+show+' REIHEN':'');
}
function calc(){let m=mats.find(x=>String(x.id)===$('#material').value)||mats[0];if(!m||m.length<=0)return;let w=n('w'),h=n('h'),qty=Math.max(1,Math.floor(n('qty'))),gap=2*n('gap'),cut=n('cut'),usable=m.width-2*n('margin');if(!w||!h||usable<=0)return;function plan(a,b,rot){if(a>usable)return null;let across=Math.floor((usable+gap)/(a+gap));if(across<1)return null;let rows=Math.ceil(qty/across);return{across,rows,rot,pieceW:a,pieceH:b,len:rows*b+Math.max(0,rows-1)*(gap+cut)}}let a=plan(w,h,false),b=plan(h,w,true),p=!a?b:!b?a:a.len<=b.len?a:b;if(!p){$('#price').textContent='FORMAT ERROR';$('#nestpreview').textContent='Format passt nicht auf die Rollenbreite';$('#nestdetail').textContent='';return}let rate=0;$$('.inkml').forEach((el,i)=>{let ml=Math.max(1,Number(el.value)||1),pr=Math.max(0,Number($$('.inkprice')[i].value)||0),v=pr/ml;rate+=v;$('#inkrate'+i).textContent=f(v)+' EUR/ML'});rate/=4;$('#inkinfo').textContent='Ø '+f(rate)+' EUR/ML';let lm=p.len/1000,area=m.width/1000*lm,motif=w*h*qty/1e6,mat=m.price/m.length*lm,ink=motif*n('inkuse')*rate,machine=area*n('machine'),extra=0;if(state.lam){let l=lams.find(x=>String(x.id)===$('#lamselect').value)||lams[0];if(l&&l.length>0){extra+=l.price/l.length*lm+area*n('lamwork');$('#lamnote').textContent=f(lm)+' LFM × '+f(l.price/l.length)+' EUR/LFM'}}if(state.contour)extra+=n('excontour');if(state.eye)extra+=n('eyeq')*n('eyep');if(state.trim)extra+=n('trimq')*n('trimp');let sk=mat+ink+machine+extra,vk=Math.max(n('minimum'),sk*n('factor'));drawNest(p,m,qty,gap,cut);$('#price').textContent=f(vk)+' EUR';$('#perpiece').textContent=f(vk/qty)+' EUR / STK';$('#lfm').textContent=f(lm)+' LFM';$('#layout').textContent=p.across+' NUTZEN // '+p.rows+' REIHEN // '+(p.rot?'90° ROTATE':'NORMAL');$('#costs').textContent='MAT '+f(mat)+' | INK '+f(ink)+' | MACHINE '+f(machine)+' | EXTRA '+f(extra)+' | SK '+f(sk);$('#status').textContent='READY // '+f(area)+' M² ROLLENFLÄCHE'}
opts();renderDB();$$('input,select').forEach(el=>el.addEventListener('input',calc));$('#material').addEventListener('change',calc);$$('.key').forEach(el=>el.onclick=()=>{state[el.dataset.key]=!state[el.dataset.key];el.classList.toggle('on',state[el.dataset.key]);el.querySelector('small').textContent=state[el.dataset.key]?'ON':'OFF';extras()});$('#addmat').onclick=()=>{mats.push({id:Date.now(),name:'NEUES MATERIAL',width:1370,length:50,price:0});renderDB();opts();calc()};$('#addlam').onclick=()=>{lams.push({id:Date.now()+1,name:'NEUES LAMINAT',width:1370,length:50,price:0});renderDB();extras()};$('#savemat').onclick=()=>{localStorage.setItem('mimakiMaterials',JSON.stringify(mats));$('#matmsg').textContent='MATERIAL DATABASE SAVED'};$('#savelam').onclick=()=>{localStorage.setItem('mimakiLaminates',JSON.stringify(lams));$('#lammsg').textContent='LAMINATE DATABASE SAVED'};$('#savesettings').onclick=()=>{let s={};for(let id of ['gap','cut','margin','machine','factor','minimum','inkuse'])s[id]=n(id);s.inks=$$('.inkml').map((x,i)=>({ml:Number(x.value),price:Number($$('.inkprice')[i].value)}));localStorage.setItem('mimakiSettings',JSON.stringify(s));$('#settingsmsg').textContent='SETTINGS + INK SAVED'};calc();
})();
</script></body></html>
